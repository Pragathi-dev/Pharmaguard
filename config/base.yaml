# PharmaGuard Base Configuration
version: "1.0"
environment: "development"

system:
  seed: 42
  debug: false
  schema_version: "1.0"

logging:
  level: "INFO"
  format: "json_lines"
  log_filename: "pharmaguard.jsonl"

research:
  default_cross_validation_folds: 5
  conformal_coverage: 0.90
  train_test_split_ratio: 0.20
  catboost_iterations: 300
  catboost_depth: 6
  catboost_learning_rate: 0.05
